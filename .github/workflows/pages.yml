# Build web/ and deploy it to GitHub Pages together with a published v1 data tree.
#
# The data is the published tree from the "published" GitHub Release
# (scripts/site_release.sh), so one deploy is always front end + every published round,
# and deploying needs no Databricks. Before the first publish it falls back to the
# synthetic example round in docs/examples/v1. The dispatcher (dispatch.yml) calls this
# workflow with the tree it just published as an Actions artifact, so the deploy can't
# race the release upload.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/examples/**"
      - "docs/schema/**"
      - "src/schema.py"
      - ".github/workflows/pages.yml"
      - "scripts/check_site.sh"
      - "scripts/site_release.sh"
  workflow_dispatch:
    inputs:
      data_source:
        description: "published = the release asset (examples if there is none yet), examples = docs/examples/v1"
        type: choice
        options: [published, examples]
        default: published
  workflow_call:
    inputs:
      artifact:
        description: "Actions artifact of this run holding the v1 tree to deploy"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits instead of cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_SOURCE: ${{ inputs.data_source || 'published' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download this run's data tree
        if: inputs.artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: _site/v1

      - name: Fetch the published data tree
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            echo "DATA_DIR=_site/v1" >> "$GITHUB_ENV"
          elif [ "$DATA_SOURCE" = published ] && scripts/site_release.sh download _site/v1; then
            echo "DATA_DIR=_site/v1" >> "$GITHUB_ENV"
          else
            echo "deploying the example round"
            echo "DATA_DIR=docs/examples/v1" >> "$GITHUB_ENV"
          fi

      # Publish is the only exit: nothing deploys unless every round passes the schema.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data against src/schema.py
        run: |
          pip install "pydantic>=2.9,<3"
          scripts/check_site.sh "$DATA_DIR"

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, build
        working-directory: web
        env:
          # e.g. "/race-preds" from the repo's Pages URL; Vite needs the trailing slash
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm test
          npm run data -- "$GITHUB_WORKSPACE/$DATA_DIR"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
