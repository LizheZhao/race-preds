# This is a Declarative Automation Bundle definition for race_preds.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: race_preds
  uuid: 45565d7b-4113-496b-8e4d-ce764a3c957d

include:
  - resources/*.yml

# deploy the repo's src/ next to the bundle, so job notebooks can import it;
# both land under ${workspace.file_path} (databricks/ and src/), gitignored files are skipped
sync:
  paths:
    - .
    - ../src

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-15e61a89-9674.cloud.databricks.com
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-15e61a89-9674.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ryozhao4962@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ryozhao4962@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ryozhao4962@gmail.com
        level: CAN_MANAGE
