resources:
  jobs:
    build_features:
      name: build_features
      max_concurrent_runs: 1
      parameters:
        - name: leakage_samples
          default: "12"
        # a round in progress, scheduled from FastF1; empty on the Tuesday rebuild
        - name: live_season
          default: ""
        - name: live_round
          default: ""
        - name: repo_root
          default: ${workspace.file_path}
      tasks:
        - task_key: features
          notebook_task:
            notebook_path: ../notebooks/build_features.py
