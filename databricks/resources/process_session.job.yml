resources:
  jobs:
    process_session:
      name: process_session
      parameters:
        - name: season
          default: "2026"
        - name: round
          default: "16"
        - name: session_id
          default: "R"
        - name: repo_root
          default: ${workspace.file_path}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest_session.py
        - task_key: bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/bronze_session.py
            base_parameters:
              session_dir: "{{tasks.ingest.values.session_dir}}"
